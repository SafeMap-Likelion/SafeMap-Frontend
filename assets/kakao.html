<!doctype html>
<html style="width: 100%; height: 100%; margin: 0; padding: 0">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kakao 지도</title>
    <!-- ✅ Kakao Developers에서 받은 JavaScript 키 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=23614367120dac5568028c0ecc6d6b56&autoload=false"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #map {
        width: 100%;
        height: 100%;
        background-color: white;
      }
    </style>
  </head>
  <body>
    <div id="map">
      <script>
        // ✅ SDK가 로드된 뒤 실행
        kakao.maps.load(function () {
          try {
            var container = document.getElementById("map");
            var options = {
              center: new kakao.maps.LatLng(33.450701, 126.570667),
              level: 3,
            };
            new kakao.maps.Map(container, options);
          } catch (e) {
            document.body.innerHTML =
              "<h3>지도 로드 실패: " + e.message + "</h3>";
          }
        });
      </script>
    </div>
  </body>
</html>
